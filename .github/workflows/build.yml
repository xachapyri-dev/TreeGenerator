name: Build Linux App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build for Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system dependencies (Qt6 & OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller (onedir with _internal)
        run: |
          pyinstaller main.py \
            --name TreeGenerator \
            --onedir \
            --windowed \
            --noconfirm \
            --clean \
            --icon favicon.ico \
            --hidden-import OpenGL.arrays.numpymodule \
            --hidden-import OpenGL.arrays.ctypesarrays \
            --hidden-import pyrr

      - name: Copy Assets and Permissions
        run: |
          cp -r shaders dist/TreeGenerator/
          cp -r translation dist/TreeGenerator/
          cp favicon.png dist/TreeGenerator/
          chmod +x dist/TreeGenerator/TreeGenerator

      - name: Pack Build to Archive
        run: |
          tar -czvf TreeGenerator-Linux.tar.gz -C dist/TreeGenerator .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeGenerator-Linux
          path: TreeGenerator-Linux.tar.gz
